services:
  redis:
    image: redis:7-alpine
    container_name: tgparser-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build: .
    container_name: tgparser-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides .env so the bot always talks to the compose-managed Redis.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

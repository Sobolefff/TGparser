[project]
name = "tgparser"
version = "0.1.0"
description = "Telegram bot that turns Wildberries / Ozon / Yandex Market links into product cards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4.0",
    "aiohttp-socks>=0.9",  # enables TELEGRAM_PROXY (http/socks4/socks5)
    "curl-cffi>=0.7.3",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "pillow>=11.0",
    "uvloop>=0.21 ; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
    "types-redis>=4.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF", "ANN", "SIM"]
# RUF001-003: the bot speaks Russian, Cyrillic look-alikes are expected everywhere.
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["curl_cffi.*", "selectolax.*", "PIL.*", "uvloop"]
ignore_missing_imports = true
